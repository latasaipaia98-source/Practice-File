{% extends "base.html" %}

{% block content %}

<h1>Delete Department</h1>

<p>Are you sure you want to delete this department?</p>

<h2>{{ department.name }}</h2>

<p><strong>Location:</strong> {{ department.location }}</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete department</button>
</form>

<br>

<a href="{% url 'department_detail' department.id %}">Cancel</a>

{% endblock %}
